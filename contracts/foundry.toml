[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
auto_detect_remappings = false
auto_detect_solc = true
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./out/safe" },
]
gas_limit = "1000000000"

[profile.default.fuzz]
runs = 128

[profile.default.invariant]
runs = 16
depth = 12
fail_on_revert = false

[profile.ci.fuzz]
runs = 128

[profile.ci.invariant]
runs = 16
depth = 12
fail_on_revert = false

[fmt]
ignore = ["lib/**", "node_modules/**"]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
