# Seedix compose project. Isolated by name and network.
# Postgres is the host's existing server. Do not add a database container.
# Nginx is the host's. Install infra/nginx/sites-available/launchpad.conf as a new site.
# Do not edit other sites.
# Every published port is bound to 127.0.0.1. Kubo API 5001 is not published.
#
# Build the web image with the env file so Next.js can inline public values.
#   docker compose --env-file /etc/seedix/app.env -f infra/docker-compose.yml build web
# NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID is a build arg. Changing it requires a rebuild.
# See docs/deploy-runbook.md. The keeper key is a host file, mode 600, owner root. It is not in this repo.
#   install -m 600 -o root /dev/null /etc/seedix/keeper.key
#   SEEDIX_KEEPER_KEY_FILE=/etc/seedix/keeper.key
# DATABASE_URL is the host Postgres URL. The default uses the host socket.

name: launchpad

networks:
  launchpad:
    name: launchpad_net
    driver: bridge

secrets:
  keeper_key:
    file: ${SEEDIX_KEEPER_KEY_FILE:-/etc/seedix/keeper.key}

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: seedix-web:local
    working_dir: /app
    command: ["npm", "run", "start", "-w", "@seedix/web", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    networks: [launchpad]
    ports:
      - "127.0.0.1:18480:3000"
    environment:
      NODE_ENV: production
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  api:
    image: node:22-bookworm
    working_dir: /app
    command:
      ["node", "--experimental-strip-types", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--eval", "import('./services/api/src/index.ts').then((m) => m.main())"]
    networks: [launchpad]
    ports:
      - "127.0.0.1:18481:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://launchpad@/launchpad?host=/var/run/postgresql}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    volumes:
      - ..:/app
      - /var/run/postgresql:/var/run/postgresql:ro
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  indexer:
    image: node:22-bookworm
    working_dir: /app
    command:
      ["node", "--experimental-strip-types", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--eval", "import('./services/indexer/src/index.ts').then((m) => m.main())"]
    networks: [launchpad]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://launchpad@/launchpad?host=/var/run/postgresql}
      RPC_URL: https://testnet-rpc.elysium.kinetiq.xyz
      INDEXER_CONFIRMATIONS: "12"
    volumes:
      - ..:/app
      - /var/run/postgresql:/var/run/postgresql:ro
    mem_limit: 3g
    cpus: 1.5
    restart: unless-stopped

  kickback:
    image: node:22-bookworm
    working_dir: /app
    command:
      ["node", "--experimental-strip-types", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--eval", "import('./services/kickback/src/index.ts').then((m) => m.main())"]
    networks: [launchpad]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://launchpad@/launchpad?host=/var/run/postgresql}
    volumes:
      - ..:/app
      - /var/run/postgresql:/var/run/postgresql:ro
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped

  keeper:
    image: node:22-bookworm
    working_dir: /app
    command:
      ["node", "--experimental-strip-types", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--eval", "import('./services/keeper/src/index.ts').then((m) => m.main())"]
    networks: [launchpad]
    environment:
      KEEPER_PRIVATE_KEY: /run/secrets/keeper_key
      KICKBACK_MANIFEST_DIR: /var/lib/seedix/manifests
      KEEPER_MAX_FEE_GWEI: "100"
      KEEPER_MAX_GAS: "12000000"
      RPC_URL: https://testnet-rpc.elysium.kinetiq.xyz
    secrets:
      - keeper_key
    volumes:
      - ..:/app
      - manifests:/var/lib/seedix/manifests
    mem_limit: 512m
    cpus: 0.25
    restart: unless-stopped

  kubo:
    image: ipfs/kubo:v0.32.1
    networks: [launchpad]
    # API stays on the compose network. Do not publish 5001.
    # Swarm is on localhost only, and not on host port 4001.
    ports:
      - "127.0.0.1:18401:4001"
      - "127.0.0.1:18486:8080"
    volumes:
      - kubo:/data/ipfs
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped

  monitoring:
    image: louislam/uptime-kuma:1
    networks: [launchpad]
    ports:
      - "127.0.0.1:18487:3001"
    volumes:
      - kuma:/app/data
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  kubo:
  kuma:
  manifests:
