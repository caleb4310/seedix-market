# No-domain site. Listens only on 8088, so it does not take port 80 or 443
# from the other sites already on this host. Do not mark it default_server.
# Enable this file alone. Do not also enable launchpad.conf: both define the
# seedix_api and seedix_upload limit zones, and nginx -t fails if both are included.
#
#   sudo cp infra/nginx/sites-available/launchpad-ip.conf /etc/nginx/sites-available/launchpad-ip.conf
#   sudo ln -s /etc/nginx/sites-available/launchpad-ip.conf /etc/nginx/sites-enabled/launchpad-ip.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove the symlink, nginx -t, reload. Never restart. Do not edit other site files.

limit_req_zone $binary_remote_addr zone=seedix_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=seedix_upload:10m rate=2r/s;

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        limit_req zone=seedix_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18481;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /logos/ {
        proxy_pass http://127.0.0.1:18481/api/logos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/upload {
        limit_req zone=seedix_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:18481;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }

    location / {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
