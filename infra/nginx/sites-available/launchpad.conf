# Install as a new file. Do not edit other sites.
# With no domain, use launchpad-ip.conf instead. It listens only on 8088.
# Do not enable both files: they define the same limit zones.
#   sudo cp infra/nginx/sites-available/launchpad.conf /etc/nginx/sites-available/launchpad.conf
#   sudo ln -s /etc/nginx/sites-available/launchpad.conf /etc/nginx/sites-enabled/launchpad.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove the symlink, nginx -t, reload. Never restart.
#
# Replace SEEDIX_DOMAIN before enabling. Issue the certificate with:
#   sudo certbot --nginx -d SEEDIX_DOMAIN
# certbot's nginx plugin edits this file only when you pass this domain.
# Renewal is the packaged certbot timer.

limit_req_zone $binary_remote_addr zone=seedix_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=seedix_upload:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SEEDIX_DOMAIN;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=seedix_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18481;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /logos/ {
        proxy_pass http://127.0.0.1:18481/api/logos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/upload {
        limit_req zone=seedix_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:18481;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }

    location / {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After certbot, a second server block listens on 443 with the certificate
# paths certbot writes into this same file.
